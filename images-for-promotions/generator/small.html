<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="frame.css"><style>
 html,body{width:440px;height:280px}
 .sstage{width:440px;height:280px;position:relative;overflow:hidden;background:var(--warm);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;justify-content:center;padding:32px 34px}
 .slogo{display:flex;align-items:center;gap:9px;margin-bottom:18px}
 .slogo svg{width:34px;height:34px;border-radius:8px;box-shadow:0 4px 12px -5px rgba(40,20,10,.5)}
 .slogo .wm{font-weight:600;font-size:18px;color:var(--ink)}
 .shead{font-family:var(--serif);font-weight:700;font-size:29px;line-height:1.12;letter-spacing:-.3px;color:var(--ink)}
 .shead .accent{color:var(--totem)}
</style></head><body>
<div class="sstage"><div class="slogo"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ts" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="white" stop-opacity="0.45"/><stop offset="50%" stop-color="white" stop-opacity="0.1"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient></defs><rect width="100" height="100" rx="18" fill="#1c1c1e"/><path d="M20 80L80 80L80 20Z" fill="#e07a5f"/><path d="M80 20L52.5 47.5L80 80Z" fill="#c96b50"/><path d="M52.5 47.5L80 20" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/><path d="M20 80L80 80L80 20Z" fill="url(#ts)"/></svg><span class="wm">Totem</span></div>
<div class="shead">Read your saved posts from a <span class="accent">calm new tab</span>.</div></div>
</body></html>
